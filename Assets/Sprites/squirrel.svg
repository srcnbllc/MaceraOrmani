<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Zemin Işıltısı -->
    <radialGradient id="sqGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2d6a4f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sqFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00"/>
      <stop offset="60%" stop-color="#e05a00"/>
      <stop offset="100%" stop-color="#b23b00"/>
    </linearGradient>
    <linearGradient id="sqBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf0d5"/>
    </linearGradient>
    <linearGradient id="sqAcorn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a0522d"/>
      <stop offset="100%" stop-color="#6f3710"/>
    </linearGradient>
    <filter id="sqDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <circle cx="80" cy="80" r="74" fill="url(#sqGlow)"/>

  <!-- Büyük Kabarık Sincap Kuyruğu -->
  <g filter="url(#sqDrop)">
    <path d="M 64 124 C 30 134, 12 110, 16 80 C 20 48, 45 22, 70 20 C 82 19, 90 28, 84 38 C 76 52, 54 58, 48 80 C 44 94, 52 114, 72 115 Z" 
          fill="url(#sqFur)"/>
    <!-- Kuyruk ucu açık tüyler -->
    <path d="M 60 22 C 74 19, 88 28, 82 40 C 76 50, 60 56, 52 74 C 47 62, 52 35, 60 22 Z" 
          fill="#ff9e00" opacity="0.8"/>
  </g>

  <!-- Arka Ayak -->
  <ellipse cx="64" cy="130" rx="14" ry="9" fill="#b23b00"/>

  <!-- Gövde -->
  <g filter="url(#sqDrop)">
    <ellipse cx="85" cy="106" rx="26" ry="24" fill="url(#sqFur)"/>
    <!-- Beyaz Göğüs ve Karın -->
    <ellipse cx="94" cy="108" rx="15" ry="17" fill="url(#sqBelly)"/>
  </g>

  <!-- Ön Ayak & Palamut (Meşe Palamudu) -->
  <g filter="url(#sqDrop)">
    <!-- Meşe Palamudu Şapkası -->
    <path d="M 104 104 Q 114 98 122 105 Q 120 110 106 109 Z" fill="#582f0e"/>
    <ellipse cx="113" cy="103" rx="9" ry="3.5" fill="#7f4f24"/>
    <!-- Meşe Palamudu Gövdesi -->
    <path d="M 106 108 C 105 120, 120 122, 121 108 Z" fill="url(#sqAcorn)"/>
    <circle cx="113" cy="101" r="1.5" fill="#3d2109"/>
    <!-- Sevimli Ön Pati -->
    <ellipse cx="103" cy="111" rx="6" ry="4.5" fill="#fdf0d5"/>
    <ellipse cx="115" cy="112" rx="5" ry="4" fill="#fdf0d5"/>
  </g>

  <!-- Kafa -->
  <g filter="url(#sqDrop)">
    <!-- Kulak (Püsküllü Sivri Sincap Kulakları) -->
    <path d="M 82 54 L 88 32 C 90 30, 96 34, 94 40 L 92 56 Z" fill="url(#sqFur)"/>
    <path d="M 85 52 L 89 36 L 93 54 Z" fill="#ffd166"/>
    <!-- Kulak ucu orman sincabı püskülü -->
    <path d="M 88 32 Q 91 26 95 30" stroke="#7f2e00" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Ana Baş -->
    <ellipse cx="102" cy="68" rx="20" ry="18" fill="url(#sqFur)"/>
    <!-- Beyaz Ağızlık/Yanak -->
    <ellipse cx="114" cy="74" rx="11" ry="9" fill="url(#sqBelly)"/>

    <!-- Parlak Canlı Göz -->
    <ellipse cx="104" cy="64" rx="5" ry="6.5" fill="#1b263b"/>
    <circle cx="106" cy="62" r="2.2" fill="#ffffff"/>
    <circle cx="102" cy="66" r="1" fill="#ffffff"/>

    <!-- Küçük Burun & Ağız Çizgisi -->
    <ellipse cx="123" cy="73" rx="2.5" ry="2" fill="#3d1308"/>
    <path d="M 121 76 Q 118 79 114 77" stroke="#b23b00" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Ayaklar (Zemin Temas) -->
  <ellipse cx="94" cy="132" rx="11" ry="5.5" fill="#ffd166"/>
</svg>
